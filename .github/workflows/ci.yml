name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: every job gets read-only repo contents unless it asks for more.
permissions:
  contents: read

env:
  # One place for the Node version. package.json "engines" allows >=22.
  NODE_VERSION: 24

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test --coverage
      # No SENTRY_AUTH_TOKEN here on purpose: next.config.ts skips the
      # source map upload without it, so the build still passes.
      # No Supabase env either: env validation runs at server start, not here.
      - run: pnpm build
        env:
          SKIP_ENV_VALIDATION: "1"

  database:
    # Local Postgres (Docker on the runner) with every migration applied,
    # then the pgTAP tests in supabase/tests. This is the only place they run:
    # development uses the cloud project and has no Docker (docs/decisions.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: 3.0.0 }
      - run: supabase db start
      - run: supabase test db

  e2e:
    # Playwright end to end (e2e/), against local Supabase with Mailpit.
    # Supabase and the build run on the runner (Supabase publishes its ports
    # on the runner's localhost). The tests run inside the official Playwright
    # image with the host network, so browsers and their system libraries come
    # from the image: no apt, no --with-deps. The image tag is read from the
    # installed @playwright/test (pinned exactly in package.json), so the two
    # can't drift; a Renovate bump moves both.
    needs: [quality, database]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - uses: supabase/setup-cli@v1
        with: { version: 3.0.0 }
      - run: pnpm install --frozen-lockfile
      # Only what the tests use: Postgres, Auth (gotrue), the API (kong +
      # postgrest), Storage (wish images), Mailpit (emails) and the Edge
      # runtime (reminder emails, the test email, unsubscribe).
      - run: supabase start -x realtime,imgproxy,postgres-meta,studio,logflare,vector,supavisor
      - name: Point the app at local Supabase
        run: |
          supabase status -o env > /tmp/supabase.env
          set -a; . /tmp/supabase.env; set +a
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "MAILPIT_URL=$MAILPIT_URL"
            # The fake VAPID public key (src/test/fake-values.ts), matching
            # supabase/functions/local-dev.env: push in e2e, never real.
            echo "NEXT_PUBLIC_VAPID_PUBLIC_KEY=BG_wO5SSQc4drdQ1GeaWDgqFtBppoFwygQOqK84VlMoWPE91OlW_AdxT9sCwx-7ni0DG_30lqW4igrmJzvccFEo"
            # The account-notice caller secret: the placeholder from
            # supabase/functions/local-dev.env (refused off a local Supabase).
            echo "ACCOUNT_NOTICE_SECRET=local-only-account-notice-secret-0000000000"
            # Ask Noor and gift ideas in e2e: on, with scripted answers (never real providers).
            echo "AI_ENABLED=true"
            echo "AI_GIFT_IDEAS_ENABLED=true"
            echo "AI_MOCK=1"
          } >> "$GITHUB_ENV"
          rm /tmp/supabase.env
      - name: Serve the Edge Functions
        # local-dev.env holds placeholders the functions refuse off a local
        # Supabase. The first request compiles the functions, so warm them up.
        run: |
          nohup supabase functions serve --env-file supabase/functions/local-dev.env > functions.log 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$NEXT_PUBLIC_SUPABASE_URL/functions/v1/unsubscribe" || true)
            [ "$code" = "303" ] && break
            sleep 2
          done
          for i in 1 2 3; do
            curl -s -m 120 -X POST "$NEXT_PUBLIC_SUPABASE_URL/functions/v1/send-reminders" \
              -H "Authorization: Bearer local-only-cron-secret" -H "Content-Type: application/json" \
              -d '{"now":"2000-01-01T00:00:00Z"}' && break
          done
      - run: pnpm build
      - name: Playwright in its official image
        # Everything the app and tests read: the Supabase URL and key (checked
        # when the server starts), Mailpit (confirmation emails) and CI=true
        # (retries, forbidOnly, HTML report, `next start`). The workspace is
        # mounted at the same path (pnpm's .bin launchers use it) and the
        # tests run as the runner's user, so nothing is left owned by root.
        run: |
          PLAYWRIGHT_VERSION=$(node -p "require('@playwright/test/package.json').version")
          echo "Playwright $PLAYWRIGHT_VERSION"
          docker run --rm --init --network host --ipc host \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" \
            -e CI=true \
            -e NEXT_PUBLIC_SUPABASE_URL -e NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY -e MAILPIT_URL \
            -e NEXT_PUBLIC_VAPID_PUBLIC_KEY -e ACCOUNT_NOTICE_SECRET -e AI_ENABLED -e AI_MOCK \
            -e AI_GIFT_IDEAS_ENABLED \
            "mcr.microsoft.com/playwright:v$PLAYWRIGHT_VERSION-noble" \
            node_modules/.bin/playwright test
      # The HTML report, plus test-results/ with the raw traces and screenshots
      # (trace: retain-on-failure), both written to the mounted workspace.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
            functions.log
          if-no-files-found: warn

  lighthouse:
    # The landing page's budgets on mobile (lighthouserc.json): performance
    # 0.9+, accessibility 1, SEO and best practices 0.95+, LCP under 2.5s, CLS
    # under 0.1. Three runs, asserted on the median. The landing page is
    # static and signed-out visitors never reach Supabase, so the placeholder
    # values from src/test/fake-values.ts are enough to start the server.
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://test.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_test_00000000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The runner's Chrome. scripts/lighthouse.ts starts the app, calibrates
      # the CPU slowdown to this runner before each of the 3 runs (so every
      # run emulates the same phone), then asserts on the median.
      - run: pnpm lighthouse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci
          # A dot folder: upload-artifact skips hidden files unless told.
          include-hidden-files: true
          if-no-files-found: warn

  evals:
    needs: quality
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Only when AI files changed
        id: ai
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -qE '^(src/ai/|evals/)'; then echo "run=true" >> $GITHUB_OUTPUT; fi
      - uses: pnpm/action-setup@v4
        if: steps.ai.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.ai.outputs.run == 'true'
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - if: steps.ai.outputs.run == 'true'
        run: pnpm install --frozen-lockfile && pnpm evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}

  secrets-scan:
    runs-on: ubuntu-latest
    # On PRs, gitleaks-action lists the PR's commits through the API
    # (GET /pulls/{n}/commits), which needs pull-requests: read.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

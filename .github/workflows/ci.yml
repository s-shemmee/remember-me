name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # One place for the Node version. package.json "engines" allows >=22.
  NODE_VERSION: 24

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test --coverage
      # No SENTRY_AUTH_TOKEN here on purpose: next.config.ts skips the
      # source map upload without it, so the build still passes.
      # No Supabase env either: env validation runs at server start, not here.
      - run: pnpm build
        env:
          SKIP_ENV_VALIDATION: "1"

  database:
    # Local Postgres (Docker on the runner) with every migration applied,
    # then the pgTAP tests in supabase/tests. This is the only place they run:
    # development uses the cloud project and has no Docker (docs/decisions.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: 3.0.0 }
      - run: supabase db start
      - run: supabase test db

  e2e:
    # Off until M2: the first Playwright specs arrive then.
    # To turn it on, delete the `if: false` line below.
    if: false
    needs: [quality, database]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - uses: supabase/setup-cli@v1
        with: { version: 3.0.0 }
      - run: pnpm install --frozen-lockfile
      - run: supabase start
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report }

  evals:
    needs: quality
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Only when AI files changed
        id: ai
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -qE '^(src/ai/|evals/)'; then echo "run=true" >> $GITHUB_OUTPUT; fi
      - uses: pnpm/action-setup@v4
        if: steps.ai.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.ai.outputs.run == 'true'
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - if: steps.ai.outputs.run == 'true'
        run: pnpm install --frozen-lockfile && pnpm evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

<!doctype html>
<html lang="en">
  <body
    style="
      margin: 0;
      padding: 0;
      background: #f4f5f9;
      font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;
      color: #1c1b1f;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="padding: 32px 16px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="max-width: 480px; background: #ffffff; border-radius: 24px; padding: 32px"
          >
            <tr>
              <td>
                <p style="margin: 0 0 8px; font-size: 15px; font-weight: 800">
                  Remember <em style="font-weight: 400; color: #c2333f">me</em>
                </p>
                <h1 style="margin: 16px 0 8px; font-size: 24px; line-height: 1.25">
                  One tap and you're in
                </h1>
                <p style="margin: 0 0 24px; font-size: 15px; line-height: 1.5; color: #5f5c66">
                  Confirm your email so we can keep your people safe with you.
                </p>
                <a
                  href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=email&next=/home"
                  style="
                    display: inline-block;
                    background: #d63b48;
                    color: #ffffff;
                    text-decoration: none;
                    font-weight: 600;
                    font-size: 15px;
                    padding: 14px 24px;
                    border-radius: 999px;
                  "
                >
                  Confirm my email
                </a>
                <p style="margin: 24px 0 0; font-size: 13px; line-height: 1.5; color: #5f5c66">
                  Didn't sign up? You can ignore this email. Nothing happens without that tap.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
